# Starts the Pensionsplaneraren sync on pensionslyft.se right away when Retirement_Planner.html changes on main, so the
# site does not wait for its own schedule (GitHub skips many scheduled runs). The site's workflow
# (mathiasboos/Pensionslyft, .github/workflows/pensionsplaneraren.yml) then fetches, checks and publishes the file.
#
# Needs the repository secret PENSIONSLYFT_DISPATCH_TOKEN: a fine-grained personal access token with access to
# mathiasboos/Pensionslyft only and the permission "Actions: Read and write". Without it this workflow does nothing
# and the site still picks the change up on its own schedule.
name: Notify Pensionslyft

on:
  push:
    branches: [main]
    paths: [Retirement_Planner.html]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the Pensionsplaneraren sync on Pensionslyft
        env:
          TOKEN: ${{ secrets.PENSIONSLYFT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::PENSIONSLYFT_DISPATCH_TOKEN is not set; the site will pick the change up on its own schedule."
            exit 0
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/mathiasboos/Pensionslyft/actions/workflows/pensionsplaneraren.yml/dispatches \
            -d '{"ref":"main"}')
          if [ "$code" != "204" ]; then
            echo "::error::GitHub answered $code"; cat response.txt; exit 1
          fi
          echo "Started the Pensionsplaneraren sync on Pensionslyft." >> "$GITHUB_STEP_SUMMARY"
