# Starts the "Kalkylatorer" sync on pensionslyft.se right away when one of the calculators that the site shows changes on
# main, so the site does not wait for its own hourly schedule (GitHub skips many scheduled runs). The site's workflow
# (mathiasboos/Pensionslyft, .github/workflows/apps.yml) then fetches, checks in a browser and publishes the calculators
# whose file is newer than the one the site has.
#
# `paths` is the list of files in scripts/lib/apps.mjs of mathiasboos/Pensionslyft. When a calculator is added to the site
# there, add its file here too. Not in the list: Retirement_Planner.html (its own workflow, notify-pensionslyft.yml) and
# Product_Calculator_offline.html (not shown on the site). The file names have spaces and must be quoted; note the space
# before ".html" in FIRE_Calculator .html.
#
# Same secret as notify-pensionslyft.yml: PENSIONSLYFT_DISPATCH_TOKEN, a fine-grained personal access token with access to
# mathiasboos/Pensionslyft only and the permission "Actions: Read and write". Without it this workflow does nothing and the
# site still picks the change up on its own schedule.
name: Notify Pensionslyft (calculators)

on:
  push:
    branches: [main]
    paths:
      - "Compound Interest Calculator.html"
      - "Pension Savings Calculator.html"
      - "Salary_Exchange.html"
      - "FIRE_Calculator .html"
      - "Net_Salary.html"
      - "Pension Overview.html"
      - "Replacement rate goal calculator.html"
      - "Pensionskompassen_offline.html"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the Kalkylatorer sync on Pensionslyft
        env:
          TOKEN: ${{ secrets.PENSIONSLYFT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::PENSIONSLYFT_DISPATCH_TOKEN is not set; the site will pick the change up on its own schedule."
            exit 0
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/mathiasboos/Pensionslyft/actions/workflows/apps.yml/dispatches \
            -d '{"ref":"main"}')
          if [ "$code" != "204" ]; then
            echo "::error::GitHub answered $code"; cat response.txt; exit 1
          fi
          echo "Started the Kalkylatorer sync on Pensionslyft." >> "$GITHUB_STEP_SUMMARY"
