<h3>1–5 · Basis</h3><ul>
<li>Annual income = gross salary × 12. The gross salary deduction (salary exchange to pension, company car, bike etc.) is deducted <em>before</em> tax and also lowers the basis for the earned income tax credit and the general pension fee.</li>
